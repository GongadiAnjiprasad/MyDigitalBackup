name: Save MAP132 DIGITALS source backup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/save-source-backup.yml

permissions:
  contents: write

jobs:
  archive-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download exact production source snapshot
        env:
          SOURCE_SHA: 63da02bcc572146bd285f254a3a4c31c4d540ff2
        run: |
          mkdir -p backups
          curl --fail --location --retry 3 \
            "https://codeload.github.com/GongadiAnjiprasad/MAP132-DIGITALS/zip/${SOURCE_SHA}" \
            --output "backups/MAP132-DIGITALS-${SOURCE_SHA}.zip"
          unzip -t "backups/MAP132-DIGITALS-${SOURCE_SHA}.zip"

      - name: Commit source archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "Add complete MAP132 DIGITALS source backup 63da02b"
          git push
